name: CI & Deploy

# On every push/PR to main we VALIDATE the code (php -l + compile every Blade
# template). The deploy job has `needs: test`, so code that would 500 the site
# can never reach the VPS. Deploy runs only for pushes to main that pass tests.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Validate (lint + Blade compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, fileinfo, gd, zip, curl, bcmath, intl, pdo_sqlite, sqlite3
          coverage: none

      - name: Prepare writable directories (absent on fresh checkout)
        run: mkdir -p bootstrap/cache storage/framework/views storage/framework/cache storage/framework/sessions storage/logs

      - name: Install Composer dependencies
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist --ignore-platform-reqs

      - name: Prepare a minimal env (no real DB needed for compilation)
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            printf 'APP_NAME=Patron\nAPP_ENV=testing\nAPP_KEY=\nAPP_DEBUG=true\nLOG_CHANNEL=stack\nDB_CONNECTION=sqlite\nDB_DATABASE=:memory:\nCACHE_DRIVER=array\nSESSION_DRIVER=array\nQUEUE_CONNECTION=sync\nMAIL_MAILER=array\n' > .env
          fi
          php artisan key:generate --force

      - name: Run validation
        run: bash bin/validate.sh

  deploy:
    name: Deploy to VPS
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: |
            set -e
            cd /var/www/patron
            git fetch --all --prune
            git reset --hard origin/main
            bash deploy.sh
